name: backend
on:
  workflow_call:
    inputs:
      module: {required: true, type: string}
      image: {required: true, type: string}
      service: {required: true, type: string}
      tag_var: {required: true, type: string}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image_ref: ${{ steps.reference.outputs.image_ref }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-db-only
          MYSQL_DATABASE: xiachen_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-db-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=20
    steps:
      - name: Check TCR publication configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REPO: ${{ vars.TCR_IMAGE_REPO }}
          REGISTRY_USER: ${{ vars.TCR_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          IMAGE_NAME: ${{ inputs.image }}
        run: |
          set -euo pipefail
          : "${IMAGE_REPO:?Set Actions variable TCR_IMAGE_REPO}" "${REGISTRY_USER:?Set Actions variable TCR_USERNAME}" "${REGISTRY_PASSWORD:?Set Actions secret TCR_PASSWORD}"
          [[ "$IMAGE_REPO" =~ ^ccr\.ccs\.tencentyun\.com/[a-z0-9][a-z0-9._-]*$ ]]
          case "$IMAGE_NAME" in xc-api|xc-admin) ;; *) exit 1;; esac
          echo "IMAGE=$IMAGE_REPO/$IMAGE_NAME" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ vars.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - uses: actions/checkout@v4
      - name: Validate deployment scripts and Compose migration
        run: python3 -m unittest discover -s deploy/tests -p 'test_*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'xc/**/pom.xml'
      - name: Verify and package
        run: mvn -B -f xc/pom.xml -pl ${{ inputs.module }} -am verify
      - name: Smoke test with isolated MySQL and Redis
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: 'jdbc:mysql://127.0.0.1:3306/xiachen_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai'
          DB_USER: root
          DB_PASSWORD: ci-db-only
          REDIS_HOST: 127.0.0.1
          JWT_SECRET: ci-only-signing-secret-at-least-32-bytes
          WX_MOCK: 'false'
          ADMIN_INIT_PASSWORD: ci-admin-only
          COS_SECRET_ID: ci-placeholder
          COS_SECRET_KEY: ci-placeholder
          COS_BUCKET: ci-placeholder-1513506595
          COS_KEY_PREFIX: ci
        run: bash deploy/scripts/smoke-test.sh ${{ inputs.module }}
      - uses: docker/setup-buildx-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - name: Build and push image to TCR
        id: image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: xc
          file: xc/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: MODULE=${{ inputs.module }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
      - name: Record immutable image reference
        id: reference
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_ref=$IMAGE@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Configuration + bounded TCR pull + version/health checks and rollback.
    timeout-minutes: 35
    concurrency:
      # Each caller permits one active release: at most API + admin reach this group.
      group: xiachen-backend-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SERVICE: ${{ inputs.service }}
      TAG_VAR: ${{ inputs.tag_var }}
      TAG: ${{ github.sha }}
      IMAGE_REF: ${{ needs.build.outputs.image_ref }}
      REGISTRY_USER: ${{ vars.TCR_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload deployment configuration
        run: bash deploy/scripts/backend-release.sh prepare
      - name: Pull verified image from TCR
        env:
          REGISTRY_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: bash deploy/scripts/backend-release.sh pull
      - name: Activate service and verify version and business endpoints
        run: bash deploy/scripts/backend-release.sh activate
      - name: Remove temporary SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/key" "$RUNNER_TEMP/known_hosts"
