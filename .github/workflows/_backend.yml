name: backend
on:
  workflow_call:
    inputs:
      module: {required: true, type: string}
      image: {required: true, type: string}
      service: {required: true, type: string}
      tag_var: {required: true, type: string}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-db-only
          MYSQL_DATABASE: xiachen_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-db-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'xc/**/pom.xml'
      - name: Verify and package
        run: mvn -B -f xc/pom.xml -pl ${{ inputs.module }} -am verify
      - name: Smoke test with isolated MySQL and Redis
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: 'jdbc:mysql://127.0.0.1:3306/xiachen_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai'
          DB_USER: root
          DB_PASSWORD: ci-db-only
          REDIS_HOST: 127.0.0.1
          JWT_SECRET: ci-only-signing-secret-at-least-32-bytes
          WX_MOCK: 'false'
          ADMIN_INIT_PASSWORD: ci-admin-only
          COS_SECRET_ID: ci-placeholder
          COS_SECRET_KEY: ci-placeholder
          COS_BUCKET: ci-placeholder-1513506595
          COS_KEY_PREFIX: ci
        run: bash deploy/scripts/smoke-test.sh ${{ inputs.module }}
      - name: Resolve image name
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ inputs.image }}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          context: xc
          file: xc/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: MODULE=${{ inputs.module }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
      - name: Package deployment image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker pull "${{ env.IMAGE }}:${{ github.sha }}"
          docker save "${{ env.IMAGE }}:${{ github.sha }}" | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: image-${{ inputs.service }}
          path: image.tar.gz
          compression-level: 0
          retention-days: 7
  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 45m transfer + 5m setup + 5m load + 15m activation/rollback + 5m margin.
    timeout-minutes: 75
    concurrency:
      # Each caller permits one active release: at most API + admin reach this group.
      group: xiachen-backend-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SERVICE: ${{ inputs.service }}
      TAG_VAR: ${{ inputs.tag_var }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ inputs.service }}
          path: ${{ runner.temp }}/deployment-image
      - name: Prepare SSH and upload deployment configuration
        run: bash deploy/scripts/backend-release.sh prepare
      - name: Transfer image with compression and resumable delta updates
        run: bash deploy/scripts/backend-release.sh upload
      - name: Verify archive and load target image
        run: bash deploy/scripts/backend-release.sh load
      - name: Activate service and verify version and business endpoints
        run: bash deploy/scripts/backend-release.sh activate
      - name: Remove temporary SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/key" "$RUNNER_TEMP/known_hosts"
