name: backend

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      image:
        required: true
        type: string
      service:
        required: true
        type: string
      tag_var:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: xc/pom.xml

      - name: Package
        run: mvn -B -f xc/pom.xml -pl ${{ inputs.module }} -am -DskipTests package

      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ inputs.image }}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: xc
          file: xc/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            MODULE=${{ inputs.module }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Update container
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SERVICE: ${{ inputs.service }}
          TAG_VAR: ${{ inputs.tag_var }}
          TAG: ${{ github.sha }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/key"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/key"
          ssh -i "$RUNNER_TEMP/key" -o StrictHostKeyChecking=no "$USER@$HOST" bash -s <<EOF
          set -e
          cd "$DEPLOY_PATH"
          export $TAG_VAR="$TAG"
          docker compose pull "$SERVICE"
          docker compose up -d --no-deps "$SERVICE"
          EOF
