name: backend
on:
  workflow_call:
    inputs:
      module: {required: true, type: string}
      image: {required: true, type: string}
      service: {required: true, type: string}
      tag_var: {required: true, type: string}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-db-only
          MYSQL_DATABASE: xiachen_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-db-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'xc/**/pom.xml'
      - name: Verify and package
        run: mvn -B -f xc/pom.xml -pl ${{ inputs.module }} -am verify
      - name: Smoke test with isolated MySQL and Redis
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: 'jdbc:mysql://127.0.0.1:3306/xiachen_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai'
          DB_USER: root
          DB_PASSWORD: ci-db-only
          REDIS_HOST: 127.0.0.1
          JWT_SECRET: ci-only-signing-secret-at-least-32-bytes
          WX_MOCK: 'false'
          ADMIN_INIT_PASSWORD: ci-admin-only
          COS_SECRET_ID: ci-placeholder
          COS_SECRET_KEY: ci-placeholder
          COS_BUCKET: ci-placeholder-1513506595
          COS_KEY_PREFIX: ci
        run: bash deploy/scripts/smoke-test.sh ${{ inputs.module }}
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ inputs.image }}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: xc
          file: xc/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: MODULE=${{ inputs.module }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
      - name: Package deployment image
        run: |
          docker pull "${{ env.IMAGE }}:${{ github.sha }}"
          docker save "${{ env.IMAGE }}:${{ github.sha }}" | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ inputs.service }}
          path: image.tar.gz
          compression-level: 0
          retention-days: 1
  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ inputs.service }}
          path: ${{ runner.temp }}/deployment-image
      - name: Upload deployment configuration and deploy
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SERVICE: ${{ inputs.service }}
          TAG_VAR: ${{ inputs.tag_var }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${DEPLOY_KEY:?}" "${KNOWN_HOSTS:?}" "${HOST:?}" "${DEPLOY_USER:?}" "${DEPLOY_PATH:?}"
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9/_-]+$ ]]
          install -m 600 /dev/null "$RUNNER_TEMP/key"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts")
          RELEASE_DIR="$DEPLOY_PATH/releases/$TAG-$SERVICE"
          tar -czf "$RUNNER_TEMP/deploy.tgz" deploy/docker-compose.yml deploy/scripts
          ssh "${opts[@]}" "$DEPLOY_USER@$HOST" "mkdir -p '$RELEASE_DIR'"
          scp "${opts[@]}" "$RUNNER_TEMP/deploy.tgz" "$DEPLOY_USER@$HOST:$RELEASE_DIR/deploy.tgz"
          scp "${opts[@]}" "$RUNNER_TEMP/deployment-image/image.tar.gz" "$DEPLOY_USER@$HOST:$RELEASE_DIR/image.tar.gz"
          ssh "${opts[@]}" "$DEPLOY_USER@$HOST" "tar -xzf '$RELEASE_DIR/deploy.tgz' -C '$RELEASE_DIR'"
          {
            for name in DEPLOY_PATH SERVICE TAG_VAR TAG RELEASE_DIR; do
              printf 'export %s=%q\n' "$name" "${!name}"
            done
            cat deploy/scripts/remote-deploy.sh
          } | ssh "${opts[@]}" "$DEPLOY_USER@$HOST" bash -s
