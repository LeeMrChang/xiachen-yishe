name: xc-admin

on:
  push:
    branches: [main]
    paths:
      - 'xc/xc-admin/**'
      - 'xc/xc-common/**'
      - 'xc/xc-domain/**'
      - 'xc/pom.xml'
      - 'xc/Dockerfile'
      - 'xc/.dockerignore'
      - 'deploy/docker-compose.yml'
      - 'deploy/scripts/**'
      - 'deploy/cnb/**'
      - '.cnb.yml'
      - '.github/workflows/_backend.yml'
      - '.github/workflows/xc-admin.yml'
      - 'scripts/ci-plan.py'
  pull_request:
    paths:
      - 'xc/xc-admin/**'
      - 'xc/xc-common/**'
      - 'xc/xc-domain/**'
      - 'xc/pom.xml'
      - 'xc/Dockerfile'
      - 'xc/.dockerignore'
      - 'deploy/docker-compose.yml'
      - 'deploy/scripts/**'
      - 'deploy/cnb/**'
      - '.cnb.yml'
      - '.github/workflows/_backend.yml'
      - '.github/workflows/xc-admin.yml'
      - 'scripts/ci-plan.py'
  workflow_dispatch:
    inputs:
      full:
        description: 'Explicitly allow an admin deployment after checks'
        type: boolean
        default: false

concurrency:
  group: xc-admin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: read
    uses: ./.github/workflows/_backend.yml
    with:
      module: xc-admin
      image: xc-admin
      service: xc-admin
      tag_var: XC_ADMIN_TAG
      full: ${{ inputs.full || false }}
    secrets: inherit
