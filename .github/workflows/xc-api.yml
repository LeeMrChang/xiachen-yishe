name: xc-api

on:
  push:
    branches: [main]
    paths:
      - 'xc/xc-api/**'
      - 'xc/xc-common/**'
      - 'xc/xc-domain/**'
      - 'xc/pom.xml'
      - 'xc/Dockerfile'
      - 'xc/.dockerignore'
      - 'deploy/docker-compose.yml'
      - 'deploy/scripts/**'
      - 'deploy/cnb/**'
      - '.cnb.yml'
      - '.github/workflows/_backend.yml'
      - '.github/workflows/xc-api.yml'
  pull_request:
    paths:
      - 'xc/xc-api/**'
      - 'xc/xc-common/**'
      - 'xc/xc-domain/**'
      - 'xc/pom.xml'
      - 'xc/Dockerfile'
      - 'xc/.dockerignore'
      - 'deploy/docker-compose.yml'
      - 'deploy/scripts/**'
      - 'deploy/cnb/**'
      - '.cnb.yml'
      - '.github/workflows/_backend.yml'
      - '.github/workflows/xc-api.yml'
  workflow_dispatch:

concurrency:
  group: xc-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: read
    uses: ./.github/workflows/_backend.yml
    with:
      module: xc-api
      image: xc-api
      service: xc-api
      tag_var: XC_API_TAG
    secrets: inherit
