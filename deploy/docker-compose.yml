services:
  xc-api:
    image: ${XC_IMAGE_REPO:-xiachen}/xc-api:${XC_API_TAG:-latest}
    container_name: xc-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    mem_limit: 768m
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m -XX:+UseZGC"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  xc-admin:
    image: ${XC_IMAGE_REPO:-xiachen}/xc-admin:${XC_ADMIN_TAG:-latest}
    container_name: xc-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    mem_limit: 512m
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseZGC"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
