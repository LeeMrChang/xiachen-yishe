server:
  port: 8082

spring:
  application:
    name: xc-admin
  profiles:
    # IDE 直接运行不带参数时落到本地配置；容器内没有 application-local.yml，仍然走环境变量
    default: local
  output:
    ansi:
      enabled: always
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/xiachen_yishe?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:xiachen}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:2}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

mybatis-plus:
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:}
  ttl-hours: 8

admin:
  init:
    username: ${ADMIN_INIT_USERNAME:admin}
    # 仅用于 staff 表为空的首次初始化；生产通过环境变量注入，禁止写入迁移脚本
    password: ${ADMIN_INIT_PASSWORD:}

xc:
  upload:
    cos:
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      region: ${COS_REGION:ap-guangzhou}
      bucket: ${COS_BUCKET:xiachenchen-images-1513506595}
      # 自定义域名（img.xiachen.xyz）；留空则用存储桶默认域名
      public-base: ${COS_PUBLIC_BASE:https://img.xiachen.xyz}
      # 同一桶内按环境分目录：本地 dev、生产 prod；必须显式配置
      key-prefix: ${COS_KEY_PREFIX:}
