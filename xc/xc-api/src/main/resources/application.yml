server:
  port: 8081

spring:
  application:
    name: xc-api
  profiles:
    # IDE 直接运行不带参数时落到本地配置；容器内没有 application-local.yml，仍然走环境变量
    default: local
  output:
    ansi:
      enabled: always
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/xiachen_yishe?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:xiachen}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:2}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

mybatis-plus:
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true

wechat:
  # 没有真实 AppID 密钥时开启：按 X-App-Id 生成固定的模拟 openid，仅本地/体验版使用
  mock: ${WX_MOCK:false}
  apps:
    - appid: ${WX_APPID_COST:}
      secret: ${WX_SECRET_COST:}
      label: cost
    - appid: ${WX_APPID_XC:}
      secret: ${WX_SECRET_XC:}
      label: xiachen

jwt:
  secret: ${JWT_SECRET:}
  ttl-days: 7
